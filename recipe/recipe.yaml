schema_version: 1

package:
  name: caddee_materials
  version: 1.0.0

source:
  path: ..

build:
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
  run:
    - python >=3.9
    - numpy
    - csdl_alpha

tests:
  - python:
      imports:
        - caddee_materials

about:
  homepage: https://github.com/LSDOlab/caddee_materials
  license: LGPL-3.0-or-later
  license_file: LICENSE.txt
  summary: A package for materials data
