# Builds the conda package from recipe/recipe.yaml and publishes it to
# anaconda.org under the LSDOlab channel, where csdl_alpha (a run dependency)
# is also published.
#
# Runs when a GitHub Release is published (e.g. via `gh release create
# vX.Y.Z`), so publishing is tied to an explicit, visible release; can also
# be triggered manually to republish/retry.

name: Publish conda package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          recipe-path: recipe/recipe.yaml
          # Prefer CSDL Alpha prereleases, then stable LSDOlab releases.
          # Publish CSDL Alpha before publishing this dependent package.

          build-args: -c LSDOlab/label/test -c LSDOlab -c conda-forge
          upload-artifact: false

      - name: Publish to anaconda.org (LSDOlab)
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_TOKEN || secrets.ANACONDA_API_KEY }}
        run: |
          for pkg in $(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \)); do
            rattler-build upload anaconda -o LSDOlab "${pkg}"
          done
